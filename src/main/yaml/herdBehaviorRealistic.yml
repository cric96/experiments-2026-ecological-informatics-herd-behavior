# Realistic variant of herdBehavior.yml.
#
# Goal: produce a velocity distribution that matches the real KABR reconstruction
# (mean ~0.51 m/s, SD ~0.18, right-skewed, censored at 1 km/h) instead of the
# too-fast / too-narrow distribution of the base config. Changes vs herdBehavior.yml,
# all grounded in compare_distributions.py:
#
#   * intrinsicForwardCoefficient swept in a TIGHT band around the measured best fit
#     (~0.31) instead of 0.1..1.0. The base range produced speeds up to ~13 km/h, far
#     beyond the real max of 4.5 km/h; concentrating the sweep keeps the mean realistic.
#   * intrinsicLateralMultiplier default set to 0.25 (the best-fitting value).
#   * The leader/trailer/zone modifiers — the only intra-run sources of spread once the
#     forward coefficient is fixed — are made MORE contrasted to widen the distribution
#     and add the missing right-skew WITHOUT moving the mean:
#       - trailers speed up harder and more often  -> heavier fast (right) tail
#       - leaders slow down more                   -> deeper slow mode
#       - more lateral movement                    -> more velocity variability
#       - stronger stress-zone repulsion           -> more low-speed mass when crowded
incarnation: protelis

variables:
  seed: &seed
    min: 0
    max: 9
    step: 1
    default: 0
  bodyLength: &bodyLen
    formula: 2
  bodyWidth: &bodyWidth
    formula: bodyLength / 2
  NumberOfAnimals: &NumberOfAnimals
    formula: 140
  stressZoneRadius:
    formula: 1.5 * bodyLength
  neutralZoneRadius:
    formula: 10 * bodyLength
  attractionZoneRadius:
    formula: 20 * bodyLength
  rearZoneRadius:
    formula: attractionZoneRadius
  EnvironmentSize:
    formula: 2000 # meters
  EnvironmentRadius: &EnvironmentRadius
    formula: EnvironmentSize / 2
  NumberOfHerds: &HerdNumber
    type: ArbitraryVariable
    parameters: [ 2, [1, 2] ]
  # Tight geometric sweep around the measured best fit (~0.31) instead of 0.1..1.0.
  intrinsicForwardCoefficient:
    type: GeometricVariable
    parameters: [ 0.31, 0.2, 0.45, 8 ]
  # 0.25 is the best-fitting lateral multiplier; keep the other levels available.
  intrinsicLateralMultiplier:
    type: ArbitraryVariable
    parameters: [ 0.25, [0.25, 0.5, 0.75] ]
  intrinsicLateralCoefficient:
    formula: intrinsicForwardCoefficient * intrinsicLateralMultiplier
  intrinsicForwardVelocity:
    formula: intrinsicForwardCoefficient * bodyLength
  intrinsicLateralVelocity:
    formula: intrinsicLateralCoefficient * bodyLength
  # Leaders slow down harder (0.7 -> 0.5): deepens the slow mode near the floor.
  leadersSlowDown:
    formula: 0.5 # [0; 1] if there are neighbors in rear zone slow down by this value
  leadersSlowDownProbability:
    formula: 0.85
  # Trailers speed up harder and more often (2.0@0.4 -> 3.0@0.5): builds the right tail.
  trailersSpeedUp:
    formula: 3.0
  trailersSpeedUpProbability:
    formula: 0.5
  zonesRadii: &zonesRadii
    formula: listOf(stressZoneRadius, neutralZoneRadius, attractionZoneRadius, rearZoneRadius)
    language: kotlin
  velocities: &velocities
    formula: listOf(intrinsicLateralVelocity, intrinsicForwardVelocity)
    language: kotlin
  # More lateral movement (0.25/0.5/0.25 -> 0.35/0.3/0.35): more velocity variability.
  movementProbabilities: &movementProbabilities
    formula: listOf(0.35, 0.3, 0.35) # Probability to go [left, forward, right]
    language: kotlin
  # Stronger repulsion when crowded (0.5 -> 0.4): more low-speed mass.
  stressZoneRepulsionFactor: &stressRepulsionFactor
    formula: 0.4 # [0; 1] Slow down by this factor if there are neighbors ahead of the individual in the stress zone.
  attractionSpeedUp: &attractionSpeedUpFactor
    formula: 1.6 # [1; inf] if there are nodes in attraction zone multiply the speed-up factor to current velocity
  leaderSpeedChange: &leaderSpeedChange
    formula: listOf(leadersSlowDown, leadersSlowDownProbability)
    language: kotlin
  trailerSpeedChange: &trailerSpeedChange
    formula: listOf(trailersSpeedUp, trailersSpeedUpProbability)
    language: kotlin

seeds:
  scenario: *seed
  simulation: *seed

launcher:
  parameters:
    batch: [seed, intrinsicForwardCoefficient, intrinsicLateralMultiplier]

network-model:
  type: ConnectWithinDistance
  parameters: [0.5]

_herdParameters: &herdParameters
  - *zonesRadii
  - *velocities
  - *movementProbabilities
  - *stressRepulsionFactor
  - *attractionSpeedUpFactor
  - *leaderSpeedChange
  - *trailerSpeedChange
  - *HerdNumber
  - *EnvironmentRadius
  - *seed

_herd: &herd
  - time-distribution: 1
    type: Event
    actions:
      type: HerdBehavior
      parameters: *herdParameters
_animal_area: &animalArea
  - type: RectangularArea
    parameters: [ *bodyLen, *bodyWidth ]

environment:
  type: MovementTrackerPhysics2DEnvironment
  parameters: ["drone"]

deployments:
  - type: GroupsDeployment
    parameters: [*NumberOfAnimals, 0, 0, *EnvironmentRadius, *HerdNumber, 25]
    contents:
      - molecule: zebra
        concentration: true
    programs: *herd
    properties: *animalArea

terminate:
  - type: AfterTime
    parameters: [ 1800 ]

export:
  - type: CSVExporter
    parameters:
      # Separate root + folder so this variant never clobbers or mixes with the
      # validated data/ dataset produced by herdBehavior.yml.
      fileNameRoot: "velocity_simulation"
      interval: 10.0
      exportPath: "data-realistic"
    data:
      - time
      - type: SpeedExtractor
